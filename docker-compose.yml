version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: toptier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: toptier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - toptier-network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toptier-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database connection (uses postgres service name as host)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/toptier

      # Email Service - MUST BE PROVIDED
      RESEND_API_KEY: ${RESEND_API_KEY}

      # Admin Authentication - MUST BE PROVIDED
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}

      # Cloudflare Turnstile (optional for development)
      NEXT_PUBLIC_TURNSTILE_SITEKEY: ${NEXT_PUBLIC_TURNSTILE_SITEKEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}

      # Optional: Recipient email for testing
      RESEND_RECIPIENT_EMAIL: ${RESEND_RECIPIENT_EMAIL:-}

      # Node environment
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - toptier-network
    env_file:
      - .env.docker

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: toptier-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@toptier.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - toptier-network
    profiles:
      - tools

# Networks
networks:
  toptier-network:
    driver: bridge

# Volumes for data persistence
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
